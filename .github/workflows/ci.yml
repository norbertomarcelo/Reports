# Integração contínua: compila a solução e roda os testes em cada push na main e em cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o código; nenhum job publica nada.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilação e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar o .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restaurar os pacotes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore

      - name: Testes (sem Chromium)
        run: dotnet test --no-build --filter "Category!=Integration"

  # Só roda depois que os testes rápidos passam, porque instalar o Chromium é a parte demorada.
  integration:
    name: Teste de integração (PDF com Chromium)
    runs-on: ubuntu-latest
    needs: test
    # O ubuntu-latest já é o 26.04, que o Playwright 1.52 não reconhece: usa os pacotes do 24.04.
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Baixar o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar o .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build

      - name: Instalar o Chromium do Playwright
        run: pwsh src/Reports.Api/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Testes de integração
        run: dotnet test --no-build --filter "Category=Integration"
